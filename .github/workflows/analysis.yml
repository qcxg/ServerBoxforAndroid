name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.44.6"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve locked dependencies
        env:
          PUB_HOSTED_URL: https://pub.dev
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze lib test

      - name: Test app
        run: flutter test

      - name: Test customized fl_lib
        run: |
          flutter test \
            packages/fl_lib/test/editor_page_test.dart \
            packages/fl_lib/test/highlights_test.dart \
            packages/fl_lib/test/text_notice_presenter_test.dart

      - name: Test customized xterm
        working-directory: packages/xterm
        run: |
          flutter pub get --enforce-lockfile
          flutter test \
            test/src/ui/custom_text_edit_test.dart \
            test/src/ui/terminal_view_key_repeat_test.dart
